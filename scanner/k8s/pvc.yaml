apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scanner-results-pvc
  labels:
    app: dolphin-scanner
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scanner-models-pvc
  labels:
    app: dolphin-scanner
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd 